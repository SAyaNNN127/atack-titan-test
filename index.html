<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Атака титанов — Кто ты в Стенах?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas>

<button id="mute" aria-label="Включить или выключить музыку">Музыка: вкл</button>

<main>
  <section id="start" class="screen active">
    <h1>Атака титанов</h1>
    <p class="lead">20 вопросов. После теста узнаешь, где твоё место: Разведкорпус, Военная полиция, Гарнизон или ты пока рядовой новобранец.</p>
    <button class="btn" id="startBtn">Вступить в ряды</button>
    <p class="hint">Музыка запускается после нажатия. Свой трек положи рядом файлом music.mp3.</p>
  </section>

  <section id="quiz" class="screen">
    <div class="top">
      <span id="counter">Вопрос 1 из 20</span>
      <span id="score">Баллы: 0</span>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <h2 id="question"></h2>
    <div id="answers"></div>
    <button class="btn" id="nextBtn" hidden>Дальше</button>
  </section>

  <section id="result" class="screen">
    <p class="big" id="finalScore"></p>
    <h2 id="rankName"></h2>
    <p class="lead" id="rankText"></p>
    <button class="btn" id="restartBtn">Пройти заново</button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
